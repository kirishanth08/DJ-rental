<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sonicFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0e17" stroke="url(#sonicFavGrad)" stroke-width="2.5" />

  <!-- DJ Headphones Arc -->
  <path d="M 17 35 A 15 15 0 0 1 47 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Headphone Ear Cups -->
  <rect x="13" y="32" width="6" height="12" rx="3" fill="#8b5cf6" />
  <rect x="45" y="32" width="6" height="12" rx="3" fill="#06b6d4" />

  <!-- Soundwave Equalizer Bars -->
  <rect x="23" y="32" width="3" height="8" rx="1.5" fill="#06b6d4" />
  <rect x="28" y="27" width="3" height="14" rx="1.5" fill="#38bdf8" />
  <rect x="33" y="24" width="3" height="17" rx="1.5" fill="#8b5cf6" />
  <rect x="38" y="30" width="3" height="11" rx="1.5" fill="#a855f7" />

  <!-- Electric Energy Accent Bolt -->
  <polygon points="35,10 27,24 33,24 29,36 41,20 34,20" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
